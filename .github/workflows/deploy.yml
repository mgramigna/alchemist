name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful verification of this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh run list --workflow verify.yml --commit "$GITHUB_SHA" --branch main --event push --status success --json databaseId --jq 'length')
          if [ "$count" -eq 0 ]; then
            echo 'Wait for Verify to succeed on this main revision, then re-run promotion.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Build
        run: bun run build
      - name: Plan production
        run: bun alchemy plan --stage prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          ASSET_ORIGIN: ${{ vars.ASSET_ORIGIN }}
      - name: Deploy production
        run: bun alchemy deploy --stage prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          ASSET_ORIGIN: ${{ vars.ASSET_ORIGIN }}
      - name: Record deployed revision
        run: |
          printf 'Deployed revision: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
